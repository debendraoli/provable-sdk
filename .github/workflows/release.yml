name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libaleo_bridge.so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            lib: libaleo_bridge.so
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            lib: libaleo_bridge.dylib
          - target: aarch64-apple-darwin
            os: macos-latest
            lib: libaleo_bridge.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-bridge
          shared-key: release-${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> rust-bridge/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> rust-bridge/.cargo/config.toml
          mkdir -p rust-bridge/.cargo

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: rust-bridge

      - name: Package
        run: |
          mkdir -p dist
          cp rust-bridge/target/${{ matrix.target }}/release/${{ matrix.lib }} dist/
          tar czf provable-sdk-${{ matrix.target }}.tar.gz -C dist ${{ matrix.lib }}

      - uses: actions/upload-artifact@v4
        with:
          name: provable-sdk-${{ matrix.target }}
          path: provable-sdk-${{ matrix.target }}.tar.gz

  release:
    name: Create release
    needs: [build-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz
