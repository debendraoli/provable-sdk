[package]
name = "aleo-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "aleo_bridge"
crate-type = ["cdylib"]

[dependencies]
snarkvm-console = { version = "4.6.0", features = ["network"] }
snarkvm-synthesizer = "4.6.0"
snarkvm-circuit-network = "4.6.0"
snarkvm-algorithms = "4.6.0"
snarkvm-ledger-block = "4.6.0"
serde_json = "1"
base64 = "0.22"
rand = "0.9"
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
